name: Security monitoring

# Scansione su ogni push/PR e ogni giorno (anche senza modifiche), con report giornaliero
# sintetico pubblicato come issue anche quando non ci sono problemi.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # 05:17 / 06:17 ora di Roma
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_VERSION: "2.7.1"
  OSV_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # storia completa per la scansione segreti
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund --ignore-scripts

      - name: Verifica firme/integrita' dei pacchetti npm
        run: npm audit signatures

      - name: npm audit + inventario supply chain
        id: audit
        env:
          SECURITY_INGEST_URL: ${{ vars.APP_URL && format('{0}/api/security/ingest', vars.APP_URL) || '' }}
          SECURITY_INGEST_SECRET: ${{ secrets.SECURITY_INGEST_SECRET }}
        run: node scripts/security-audit.mjs --fail-on=none

      - name: Installa gitleaks (binario verificato con SHA256)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scansione segreti (storia git completa)
        run: ./gitleaks git --redact --no-banner --report-format json --report-path security-reports/gitleaks.json --exit-code 0 .

      - name: Installa OSV-Scanner (binario verificato con SHA256)
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: OSV-Scanner (lockfile npm)
        run: ./osv-scanner scan source --lockfile package-lock.json --format json --output-file security-reports/osv.json || true

      - name: Sintesi e soglie
        id: summary
        run: |
          node -e '
            const fs=require("fs");
            const inv=JSON.parse(fs.readFileSync("security-reports/inventory.json","utf8"));
            const gl=fs.existsSync("security-reports/gitleaks.json")?JSON.parse(fs.readFileSync("security-reports/gitleaks.json","utf8")||"[]"):[];
            const osv=fs.existsSync("security-reports/osv.json")?JSON.parse(fs.readFileSync("security-reports/osv.json","utf8")||"{}"):{};
            const osvCount=(osv.results||[]).flatMap(r=>r.packages||[]).flatMap(p=>p.vulnerabilities||[]).length;
            const c=s=>inv.findings.filter(f=>f.severity===s).length;
            const lines=[
              `## Report sicurezza giornaliero - ${new Date().toISOString().slice(0,10)}`,
              ``,
              `| Controllo | Esito |`,`|---|---|`,
              `| npm audit | critical ${c("critical")}, high ${c("high")}, moderate ${c("moderate")}, low ${c("low")} |`,
              `| OSV-Scanner | ${osvCount} vulnerabilita note |`,
              `| Segreti (gitleaks, storia completa) | ${gl.length} possibili segreti (valori redatti) |`,
              `| Dipendenze | ${inv.dependencies.direct} dirette, ${inv.dependencies.total} totali |`,
              `| Actions fissate a SHA | ${inv.actions.filter(a=>a.pinnedSha).length}/${inv.actions.length} |`,
              ``,
              gl.length? "Segreti: "+gl.map(g=>`${g.File}:${g.StartLine} (${g.RuleID})`).join(", ") : "Nessun segreto rilevato.",
              ``,
              "Dettagli completi negli artefatti del workflow. Nessun esito equivale a sicurezza assoluta."
            ];
            fs.writeFileSync("security-reports/summary.md", lines.join("\n"));
            const block = c("critical")>0 || gl.length>0;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `block=${block}\n`);
          '
          cat security-reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports-${{ github.run_id }}
          path: security-reports/
          retention-days: 30

      - name: Blocca la PR/push in presenza di critical o segreti
        if: steps.summary.outputs.block == 'true'
        run: |
          echo "Trovate vulnerabilita' critiche o segreti: vedi summary e artefatti." && exit 1

  dependency-review:
    # disponibile gratis su repository pubblici; su privati richiede GitHub Advanced Security (a pagamento)
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, SSPL-1.0

  daily-report:
    # issue giornaliera sintetica anche in assenza di problemi
    needs: scan
    # su repository pubblici l'issue renderebbe pubbliche le vulnerabilita': solo report interno (ingest)
    if: always() && github.event.repository.private == true && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-reports-${{ github.run_id }}
          path: security-reports
      - name: Pubblica o aggiorna l'issue del giorno
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Security report $(date -u +%F)"
          BODY_FILE=security-reports/summary.md
          [ -f "$BODY_FILE" ] || echo "Scansione non completata: controllare il workflow ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}" > "$BODY_FILE"
          gh label create security-report --color B60205 --description "Report sicurezza automatico" 2>/dev/null || true
          EXISTING=$(gh issue list --label security-report --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body-file "$BODY_FILE"; else gh issue create --title "$TITLE" --label security-report --body-file "$BODY_FILE"; fi
          # chiude i report dei giorni precedenti per mantenere solo l'ultimo aperto
          gh issue list --label security-report --state open --json number,title --jq ".[] | select(.title != \"$TITLE\") | .number" | xargs -r -n1 gh issue close
